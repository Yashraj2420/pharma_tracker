<!DOCTYPE html>
<html>
<head>
    <title>Medicine Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .valid {
            color: #22c55e;
        }
        .invalid {
            color: #ef4444;
        }
        .warning {
            color: #facc15;
        }
        p {
            font-size: 18px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="card">
    {{% if valid %}
        <h2>✅ Product is Genuine</h2>
        <p>Batch Code: {{ batch.batch_code }}</p>
        <p>Expiry Date: {{ batch.exp_date }}</p>

    {% if expired %}
        <p style="color:red;">⚠️ Product is Expired</p>
    {% endif %}

    {% else %}
        <h2 style="color:red;">❌ Invalid or Fake Product</h2>
    {% endif %}

</div>

</body>
</html>
